    <title>Paani</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults.css">
    <style>
      /* The component paints the water palette inside its shadow root, but the

       * would show as a gutter around the page. */

      body {
        margin: 0;
        background: #f1f8fb;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #121a1e;
        }
      }
    </style>

    <script type="module" src="app.js"></script>
